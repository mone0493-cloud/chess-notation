<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>OTB Chess — Real board. No screen.</title>
<style>
  :root{
    /* ink on paper: the palette of a wooden board and a score sheet */
    --bg:#fdfdfc; --panel:rgba(255,255,255,.86); --panel2:#ffffff;
    --line:rgba(43,39,35,.14); --txt:#2b2723; --dim:#7d766e;
    --accent:#8a5a2b; --warn:#c07a12; --bad:#a8392e; --ok:#5c7a3f;
    --bg-check:#f7ebd4; --bg-mate:#f4dcd6; --bg-draw:#f2eccd; --bg-win:#e6eeda;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(#fefefe 0%,#f7f5f1 100%);
    color:var(--txt);display:flex;flex-direction:column;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:8px;overflow:hidden;
  }
  .wrap{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}

  /* ---------- backdrop: one real 8x8 board, seen in perspective, static ---------- */
  .setup{perspective:900px;perspective-origin:50% 34%;overflow:hidden}
  .ghost{position:absolute;left:50%;top:52%;width:min(150%,760px);aspect-ratio:1;z-index:0;
    pointer-events:none;
    transform:translate(-50%,-50%) rotateX(58deg);
    background-image:conic-gradient(rgba(90,66,42,.13) 0 25%,transparent 0 50%,
                                    rgba(90,66,42,.13) 0 75%,transparent 0);
    background-size:25% 25%;              /* 4 cycles = 8 squares per side */
    border:1px solid rgba(90,66,42,.18);
    mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 30%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 30%,transparent 100%)}
  .setup > *:not(.ghost){position:relative;z-index:1}

  /* ---------- setup ---------- */
  .setup{display:flex;flex-direction:column;gap:16px;justify-content:center;flex:1;
    padding:6px 4px}
  .hero{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:4px}
  .logo{width:min(74%,260px);height:auto;display:block;margin:0 auto}
  .claim{text-align:center;font-size:1.02em;font-weight:600;color:var(--txt);
    letter-spacing:.2px;margin-top:8px}
  .tagline{text-align:center;color:var(--dim);font-size:.82em;line-height:1.5;
    max-width:320px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  label{font-size:.7em;color:var(--dim);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:1.2px}
  select,button,input{font:inherit;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:13px}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .start{padding:15px;font-size:1.02em;letter-spacing:.6px;border:none;
    background:linear-gradient(135deg,#3a3430,#221f1c);box-shadow:0 6px 18px rgba(43,39,35,.28)}
  .start:disabled{background:#cdc4b5;color:#8a8175;box-shadow:none}
  button{cursor:pointer}
  button:active{filter:brightness(.88)}
  button:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- game ---------- */
  .game{display:none;flex-direction:column;gap:8px;flex:1;min-height:0}
  .game.on{display:flex}

  .topbar{display:flex;gap:6px;align-items:stretch}
  .badge{flex:1;padding:7px 12px;border-radius:9px;background:var(--panel);
    border:1px solid var(--line);font-size:.72em;color:var(--dim);letter-spacing:.4px;
    display:flex;align-items:center;justify-content:center;gap:7px;text-align:center}
  .badge b{color:var(--txt);font-weight:600}
  .badge .pc{font-size:1.5em;line-height:1;font-family:serif;color:#5a5148}
  .tbtn{padding:7px 11px;font-size:.75em;background:var(--panel);border:1px solid var(--line);
    color:var(--dim);border-radius:9px}
  .tbtn.active{border-color:var(--accent);color:var(--accent)}

  .state{padding:9px;border-radius:9px;text-align:center;font-weight:700;letter-spacing:.6px;
    background:var(--panel);border:2px solid var(--line);font-size:.88em}
  @keyframes glow{
    0%,100%{box-shadow:0 0 0 0 rgba(255,152,0,0)}
    50%{box-shadow:0 0 14px 1px currentColor}
  }

  /* ---------- the turn: two framed cards, side by side ---------- */
  .stage{flex:1;min-height:120px;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;gap:10px;padding:10px 6px 6px;position:relative}
  .turnchip{font-size:.62em;letter-spacing:2px;text-transform:uppercase;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px}

  /* the two frames fill the free height instead of floating in the middle */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;
    flex:1;min-height:0;max-height:300px;align-items:stretch}
  .plycard{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;
    padding:12px 8px 14px;border-radius:16px;border:1px solid var(--line);
    background:rgba(255,255,255,.5);min-width:0;overflow:hidden}
  .plycard .san{flex:1;display:flex;align-items:center;justify-content:center}
  .plycard .who{font-size:.58em;letter-spacing:1.8px;text-transform:uppercase;font-weight:600;
    color:var(--dim);display:flex;align-items:center;gap:5px}
  .plycard .san{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;
    line-height:1.05;text-align:center;word-break:break-word}
  .plycard .sub{font-size:.7em;line-height:1.35;color:var(--dim);text-align:center;
    min-height:2.3em;display:flex;align-items:center;justify-content:center}

  .plycard .king{font-size:1.5em;line-height:1;font-family:"Apple Symbols","Segoe UI Symbol",serif;
    font-variant-emoji:text}
  .plycard .side{font-weight:700;letter-spacing:2px}

  /* ---- the two cards carry the actual piece colour ---- */
  .plycard.light{background:#fffdf8;border-color:rgba(43,39,35,.24)}
  .plycard.light .who{color:#6e655c}
  .plycard.light .king{color:#3a342e}
  .plycard.light .san{color:#2b2723}
  .plycard.light .sub{color:#7a7168}

  .plycard.dark{background:#2e2823;border-color:#2e2823}
  .plycard.dark .who{color:#b8ac9c}
  .plycard.dark .king{color:#f2ece1}
  .plycard.dark .san{color:#f7f2e8}
  .plycard.dark .sub{color:#a99d8d}
  .plycard.dark .sub.warn{color:#e8a94a}

  /* mine stays a shade quieter than theirs, whatever the colour */
  .mine .san{font-size:clamp(1.9rem,9.5vw,2.7rem);opacity:.72}
  .theirs .san{font-size:clamp(2.3rem,12vw,3.5rem)}
  .theirs{cursor:pointer}
  .theirs .who::before{content:"▸";font-size:.9em;opacity:.6}
  .theirs.fresh{animation:cardFlash 1.1s ease-out}
  @keyframes cardFlash{
    0%  {box-shadow:0 0 0 5px rgba(138,90,43,.34)}
    62% {box-shadow:0 0 0 5px rgba(138,90,43,.34)}
    100%{box-shadow:0 3px 14px rgba(138,90,43,.13)}
  }
  .theirs.speaking .san{animation:sayPulse 1s ease-out}
  @keyframes sayPulse{0%{opacity:.4}100%{opacity:1}}

  /* ---- whose turn it is: the active frame lights up ---- */
  .plycard{position:relative;transition:border-color .2s, box-shadow .2s, background .2s}
  .plycard.turn{border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(138,90,43,.34), 0 6px 20px rgba(138,90,43,.18)}
  .mine.turn .san{opacity:1}
  .plycard.turn.light{background:#fffefb}
  .plycard.turn.dark{background:#3a332c}
  /* a live dot next to the label of whoever must move */
  .plycard.turn .who::after{content:"";width:7px;height:7px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 0 rgba(138,90,43,.55);
    animation:turnDot 1.8s ease-out infinite}
  @keyframes turnDot{
    0%{box-shadow:0 0 0 0 rgba(138,90,43,.55)}
    70%{box-shadow:0 0 0 7px rgba(138,90,43,0)}
    100%{box-shadow:0 0 0 0 rgba(138,90,43,0)}
  }

  /* the waiting one steps back */
  .plycard:not(.turn){opacity:.72}
  @media (prefers-reduced-motion:reduce){ .plycard.turn .who::after{animation:none} }

  /* collapsible panels */
  .panel{display:none;background:var(--panel);border-radius:12px;padding:10px;max-height:30vh;overflow-y:auto}
  .panel.on{display:block}
  /* board panel never scrolls: the board shrinks to fit */
  #boardPanel{max-height:none;overflow:hidden;padding:8px;flex:0 0 auto}
  /* the key pad grows and shrinks between moves: give the board a fixed slot
     so the grid never resizes mid-game */
  .game:has(#boardPanel.on) .stage{flex:0 0 auto;min-height:0}
  .game:has(#boardPanel.on) .keys{max-height:19vh}
  .histBar{display:flex;align-items:center;gap:7px;padding-bottom:8px;margin-bottom:6px;
    border-bottom:1px solid var(--line);font-size:.7em;color:var(--dim);letter-spacing:.5px}
  .histBar .grow{flex:1}
  .histBar .mini{font-size:.92em;letter-spacing:.8px;font-weight:600}
  .row{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;
    font-family:ui-monospace,Menlo,monospace;font-size:.95em;padding:3px 0}
  .row .n{color:#666}
  .row .b{color:var(--accent)}
  .empty{color:var(--dim);font-size:.85em;text-align:center;padding:8px}

  /* board */
  .board{display:grid;grid-template-columns:12px repeat(8,1fr);grid-template-rows:repeat(8,1fr) 12px;
    width:min(100%,290px);aspect-ratio:1/1.05;margin:0 auto;user-select:none}
  .sq{display:flex;align-items:center;justify-content:center;
    font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif;
    font-variant-emoji:text;
    font-size:min(7.2vw,26px);line-height:1}
  .sq.l{background:#b0b0b0}
  .sq.d{background:#5c6870}
  .sq.hl{box-shadow:inset 0 0 0 3px var(--warn)}
  /* a thick stroke fills the small glyphs and turns white pieces black: keep it hairline */
  .sq .w{color:#fff;-webkit-text-stroke:.5px rgba(10,20,35,.8);paint-order:stroke fill;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .sq .b{color:#2b2520;-webkit-text-stroke:.5px rgba(255,255,255,.35);paint-order:stroke fill}
  .sq .pc-p{font-size:.88em}
  .sq .pc-n,.sq .pc-b{font-size:.96em}
  .sq .pc-k,.sq .pc-q{font-size:1.05em}
  .coord{display:flex;align-items:center;justify-content:center;font-size:.58em;color:var(--dim)}

  /* ---------- composer ---------- */
  .composer{background:var(--panel);border-radius:14px;padding:11px 11px 9px;
    display:flex;flex-direction:column;gap:9px;flex:0 0 auto}
  .chead{display:flex;align-items:center;gap:8px;min-height:26px}
  .chead{flex-wrap:nowrap}
  .chead .txt{flex:1 1 auto;min-width:0;font-size:.78em;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chead .mini{flex:0 0 auto}
  .chead .txt b{color:var(--txt);font-family:ui-monospace,Menlo,monospace;font-size:1.15em}
  .mini{padding:5px 10px;font-size:.72em;background:var(--panel2);border:1px solid var(--line);
    color:var(--dim);border-radius:8px}
  .mini.active{border-color:var(--accent);color:var(--accent)}

  .keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;
    max-height:38vh;overflow-y:auto}
  .key{height:62px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:ui-monospace,Menlo,monospace;font-size:1.2em;font-weight:600;padding:3px}
  .key .g{font-size:1.55em;line-height:1;color:#5a5148;font-variant-emoji:text;
    font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
  .key .tag{font-size:.55em;color:var(--dim);font-family:-apple-system,sans-serif;font-weight:400;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .key:active{background:var(--accent);border-color:var(--accent)}
  /* when a panel is open, give it room by shrinking the key pad */
  .game:has(.panel.on) .keys{max-height:24vh}
  .key.wide{grid-column:span 2}
  .key.cap{border-color:rgba(168,57,46,.5);background:rgba(168,57,46,.09)}
  .key.cap .tag{color:#8f3a2c}
  /* disambiguation keys: tinted, not dark — the label must stay readable */
  .key.done{background:rgba(138,90,43,.14);border-color:rgba(138,90,43,.55);color:var(--accent)}
  .key.done .tag{color:#7a5a33}

  .typed{display:none;gap:7px}
  .typed.on{display:flex}
  .typed input{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:1.1em;text-align:center;padding:11px}
  .typed input:focus{outline:none;border-color:var(--accent)}
  .msg{font-size:.76em;min-height:1em;color:var(--dim);text-align:center}
  .msg.err{color:var(--bad)}

  .fatal{padding:16px;border:1px solid var(--bad);border-radius:10px;color:var(--bad);
    font-size:.85em;text-align:center;line-height:1.5}
  .hidden{display:none!important}
  /* ==================== SKINS ==================== */

  /* ---- GLASS : light, translucent, iOS ---- */
  
  html .panel,html .composer,html .stage,
  html .badge,html .state,html .card{
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 6px 22px rgba(80,62,40,.10);border-color:rgba(255,253,248,.75)}
  html .key{background:var(--panel2);border:1px solid rgba(43,39,35,.12);
    border-radius:15px;box-shadow:0 2px 6px rgba(43,39,35,.07)}
  html .key .g{color:#5a5148}
  html .stage,html .composer{border-radius:20px}
  html .sq.l{background:#efe6d4}html .sq.d{background:#b09274}
  html .sq .w{color:#fffdf7}html .sq .b{color:#2b2520}
  

  /* ---- PAPER : chess book, serif, ink on cream ---- */
    --line:#d5cbb2;--txt:#241f18;--dim:#7d7361;--accent:#8a5a2b}
    border-radius:3px;box-shadow:none;border:1px solid #ddd3bb}

  /* ---- style picker ---- */
  .sheet{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;
    background:rgba(0,0,0,.45)}
  .sheet.on{display:flex}
  .sheetBox{width:100%;max-width:520px;margin:0 auto;background:var(--panel);
    border-radius:18px 18px 0 0;border-top:1px solid var(--line);
    padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
  .sheetBox h3{font-size:.7em;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);
    margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
  .sheetBox h3 button{background:none;border:none;color:var(--dim);font-size:1.4em;padding:0 4px}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sbtn{padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);
    color:var(--txt);text-align:left}
  .sbtn b{display:block;font-size:.86em;font-weight:600}
  .sbtn span{display:block;font-size:.64em;color:var(--dim);margin-top:2px}
  .sbtn.sel{border-color:var(--accent)}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

  /* ---- game state alerts: declared last and with higher specificity than any
         skin rule, so the border always lights up whatever the theme ---- */
  html .state.check{
    border:2px solid var(--warn);color:var(--warn);background:var(--bg-check);
    font-size:1em;animation:glow 2.2s ease-in-out infinite}
  html .state.mate{
    border:2px solid var(--bad);color:var(--bad);background:var(--bg-mate);
    font-size:1em;animation:glow 2.2s ease-in-out infinite}
  html .state.win{
    border:2px solid var(--ok);color:var(--ok);background:var(--bg-win);
    font-size:1em;animation:glow 2.2s ease-in-out infinite}
  html .state.draw{
    border:2px solid #c7a600;color:#a58a00;background:var(--bg-draw);font-size:.94em}
  /* light themes need light tints, the dark ones would look like a hole */
    --bg-check:#fdefd8; --bg-mate:#fbdedb; --bg-draw:#f6f0d0; --bg-win:#e3f1e1;
  }
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-thumb{background:#3d3d3d;border-radius:2px}
</style>
</head>

<script>
/* ============ 1. Engine loader (multi-CDN fallback) ============ */
const CDNS=[
  "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js",
  "https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js",
  "https://unpkg.com/chess.js@0.10.3/chess.js"
];
const $=id=>document.getElementById(id);
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');
  s.src=src;s.onload=res;s.onerror=()=>rej();document.head.appendChild(s);});}
(async function boot(){
  for(const u of CDNS){
    try{ await loadScript(u);
      if(typeof Chess!=='undefined'){ $('loaderBox').textContent='Engine ready ✓';
        $('startBtn').disabled=false; return; }
    }catch(e){}
  }
  $('loaderBox').classList.add('hidden');
  $('fatalBox').classList.remove('hidden');
  $('fatalBox').innerHTML='Could not load the chess engine.<br>An internet connection is required on first load.<br>Please reload the page.';
})();

/* ============ 2. State ============ */
let game=null, human='w', level=3, busy=false, over=false;
let sel={piece:null,to:null};

/* ============ 3. AI ============ */
const VAL={p:100,n:320,b:330,r:500,q:900,k:20000};
const PST={
 p:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,
    0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
 n:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,
    -30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,
    -40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
 b:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,
    -10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,
    -10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
 r:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,
    -5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
 q:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,
    -5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,
    -10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
 k:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,
    -30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,
    20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20]
};
function evaluate(g){
  const b=g.board(); let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const q=b[r][c]; if(!q) continue;
    const i=r*8+c, pst=PST[q.type][q.color==='w'?i:(7-r)*8+c];
    s += q.color==='w' ? (VAL[q.type]+pst) : -(VAL[q.type]+pst);
  }
  return s;
}
function search(g,d,a,b,max){
  if(d===0) return evaluate(g);
  const ms=g.moves({verbose:true});
  if(!ms.length) return g.in_check() ? (max?-99999:99999) : 0;
  ms.sort((x,y)=>(y.captured?1:0)-(x.captured?1:0));
  if(max){ let best=-Infinity;
    for(const m of ms){ g.move(m); best=Math.max(best,search(g,d-1,a,b,false)); g.undo();
      a=Math.max(a,best); if(b<=a) break; }
    return best;
  } else { let best=Infinity;
    for(const m of ms){ g.move(m); best=Math.min(best,search(g,d-1,a,b,true)); g.undo();
      b=Math.min(b,best); if(b<=a) break; }
    return best; }
}
/* Each band mixes four dials, not just search depth:
   d     = plies of search (how far ahead it looks)
   rnd   = chance of a plainly random move (loses the thread)
   noise = centipawn noise on the evaluation (misjudges positions)
   greed = chance of grabbing material without checking the consequences  */
const BANDS={
  400 :{d:1,rnd:.34,noise:240,greed:.55},
  600 :{d:1,rnd:.23,noise:185,greed:.45},
  800 :{d:2,rnd:.15,noise:145,greed:.32},
  1000:{d:2,rnd:.085,noise:110,greed:.20},
  1200:{d:2,rnd:.04,noise:78,greed:.10},
  1400:{d:3,rnd:.018,noise:52,greed:.04},
  1600:{d:3,rnd:.007,noise:30,greed:0},
  1800:{d:3,rnd:0,noise:12,greed:0}
};
function gauss(){
  let u=0,v=0;
  while(!u) u=Math.random();
  while(!v) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
/* Filters out moves no human would play: shuffling a rook or walking the king
   out while castling is still available, or undoing your own last move. */
function stillCastles(color,side){
  const rights=game.fen().split(' ')[2];
  if(rights==='-') return false;
  const ch = color==='w' ? (side==='k'?'K':'Q') : (side==='k'?'k':'q');
  return rights.includes(ch);
}
function sillyMove(m){
  const color=game.turn();
  const h=game.history({verbose:true});
  const opening = h.length < 20;               // first ten full moves
  const castling = /^O-O/.test(m.san);
  if(opening && !castling){
    if(m.piece==='k' && (stillCastles(color,'k')||stillCastles(color,'q'))) return true;
    if(m.piece==='r'){
      if((m.from==='a1'||m.from==='a8') && stillCastles(color,'q')) return true;
      if((m.from==='h1'||m.from==='h8') && stillCastles(color,'k')) return true;
    }
  }
  const lastOwn = h.length>=2 ? h[h.length-2] : null;   // my previous move
  if(lastOwn && lastOwn.color===color && m.from===lastOwn.to && m.to===lastOwn.from
     && !m.captured && !game.in_check()) return true;
  return false;
}

function pickBotMove(){
  const cfg=BANDS[level]||BANDS[800];
  const all=game.moves({verbose:true});
  if(!all.length) return null;
  const sane=all.filter(m=>!sillyMove(m));
  const ms = sane.length ? sane : all;        // never leave the engine without a move

  // loses the thread entirely
  if(Math.random()<cfg.rnd) return ms[Math.floor(Math.random()*ms.length)];

  // grabs the biggest capture on sight, without looking at the reply
  if(cfg.greed && Math.random()<cfg.greed){
    const caps=ms.filter(m=>m.captured);
    if(caps.length){
      caps.sort((a,b)=>VAL[b.captured]-VAL[a.captured]);
      return caps[0];
    }
  }

  const white=game.turn()==='w';
  let best=null, bestScore=white?-Infinity:Infinity;
  for(const m of ms){
    game.move(m);
    let v=search(game,cfg.d-1,-Infinity,Infinity,!white);
    game.undo();
    v += gauss()*cfg.noise;              // misjudges the position
    if(white ? v>bestScore : v<bestScore){ bestScore=v; best=m; }
  }
  return best||ms[0];
}

/* ============ 4. Text input (fallback) ============ */
const IT2EN={c:'N',a:'B',t:'R',d:'Q',r:'K'};
function norm(s){return s.replace(/[\s+#!?]/g,'').replace(/0/g,'O').toLowerCase();}
function resolveText(raw){
  const ms=game.moves({verbose:true}), t=norm(raw); if(!t) return null;
  if(t==='oo'||t==='o-o') return ms.find(m=>m.san==='O-O')||null;
  if(t==='ooo'||t==='o-o-o') return ms.find(m=>m.san==='O-O-O')||null;
  let hit=ms.filter(m=>norm(m.san)===t); if(hit.length===1) return hit[0];
  if(IT2EN[t[0]]){ const c=IT2EN[t[0]]+t.slice(1);
    hit=ms.filter(m=>norm(m.san)===norm(c)); if(hit.length===1) return hit[0]; }
  const ft=t.match(/^([a-h][1-8])([a-h][1-8])([qrbn])?$/);
  if(ft){ hit=ms.filter(m=>m.from===ft[1]&&m.to===ft[2]&&(!ft[3]||m.promotion===ft[3]));
    if(hit.length) return hit[0]; }
  if(/^[a-h][1-8]$/.test(t)){ hit=ms.filter(m=>m.to===t); if(hit.length===1) return hit[0]; }
  return hit.length>1?{ambiguous:hit}:null;
}

/* ============ 5. Tap composer ============ */
const GLYPH={p:'♙\uFE0E',n:'♘\uFE0E',b:'♗\uFE0E',r:'♖\uFE0E',q:'♕\uFE0E',k:'♔\uFE0E'};  // keys: outline
// \uFE0E forces TEXT presentation. Without it the pawn (U+265F) is rendered as a colour
// emoji by the system font: always black, wrong size, immune to CSS colour.
const BOARD_GLYPH={p:'♟\uFE0E',n:'♞\uFE0E',b:'♝\uFE0E',r:'♜\uFE0E',q:'♛\uFE0E',k:'♚\uFE0E'};
const PNAME={p:'Pawn',n:'Knight',b:'Bishop',r:'Rook',q:'Queen',k:'King'};
function myMoves(){ return (over||busy||!game||game.turn()!==human) ? [] : game.moves({verbose:true}); }
function isCastle(m){ return m.san==='O-O'||m.san==='O-O-O'; }

function mkKey(html,fn,extra){
  const b=document.createElement('button');
  b.className='key'+(extra?' '+extra:'');
  b.innerHTML=html; b.onclick=fn; return b;
}
function renderKeys(){
  const keys=$('keys'), crumb=$('crumb'), back=$('backBtn'), ms=myMoves();
  keys.innerHTML='';
  if(!ms.length){
    back.classList.add('hidden');
    crumb.textContent = over ? 'Game over' : 'Waiting for opponent…';
    return;
  }

  /* step 1 — piece */
  if(!sel.piece){
    back.classList.add('hidden');
    crumb.textContent='Pick a piece';
    const types=new Set(ms.filter(m=>!isCastle(m)).map(m=>m.piece));
    ['p','n','b','r','q','k'].filter(t=>types.has(t)).forEach(t=>{
      const n=ms.filter(m=>m.piece===t&&!isCastle(m)).length;
      keys.appendChild(mkKey(
        `<span class="g">${GLYPH[t]}</span><span class="tag">${PNAME[t]} · ${n}</span>`,
        ()=>{ sel.piece=t; renderKeys(); }));
    });
    ms.filter(isCastle).forEach(m=>{
      keys.appendChild(mkKey(
        `<span>${m.san}</span><span class="tag">${m.san==='O-O'?'short castle':'long castle'}</span>`,
        ()=>play(m),'wide'));
    });
    return;
  }

  const cand=ms.filter(m=>m.piece===sel.piece&&!isCastle(m));
  back.classList.remove('hidden');

  /* step 2 — destination */
  if(!sel.to){
    crumb.innerHTML=`<span style="font-family:serif;font-size:1.3em;color:#5a5148">${GLYPH[sel.piece]}</span> ${PNAME[sel.piece]} to…`;
    [...new Set(cand.map(m=>m.to))].sort().forEach(to=>{
      const grp=cand.filter(m=>m.to===to), cap=grp.some(m=>m.captured);
      const tag = cap ? 'takes '+PNAME[grp.find(m=>m.captured).captured].toLowerCase()
                      : (grp.length>1 ? (grp[0].promotion?'promote':'2 options') : '&nbsp;');
      keys.appendChild(mkKey(`<span>${cap?'×':''}${to}</span><span class="tag">${tag}</span>`,
        ()=>{ if(grp.length===1) play(grp[0]); else { sel.to=to; renderKeys(); } },
        cap?'cap':''));
    });
    return;
  }

  /* step 3 — promotion or same-square disambiguation */
  const grp=cand.filter(m=>m.to===sel.to);
  if(grp.every(m=>m.promotion)){
    crumb.innerHTML=`Promote on <b>${sel.to}</b>`;
    ['q','r','b','n'].forEach(p=>{
      const m=grp.find(x=>x.promotion===p); if(!m) return;
      keys.appendChild(mkKey(`<span class="g">${GLYPH[p]}</span><span class="tag">${PNAME[p]}</span>`,()=>play(m)));
    });
  } else {
    crumb.innerHTML=`Which ${PNAME[sel.piece].toLowerCase()} to <b>${sel.to}</b>?`;
    grp.forEach(m=>keys.appendChild(
      mkKey(`<span>${m.san}</span><span class="tag">from ${m.from}</span>`,()=>play(m),'done')));
  }
}
function resetSel(){ sel={piece:null,to:null}; }

/* ============ 6. Flow ============ */
function startGame(){
  const sd=$('side').value;
  human = sd==='random' ? (Math.random()<.5?'w':'b') : sd;
  level = +$('lvl').value;
  game=new Chess(); over=false; busy=false; resetSel();
  $('setup').style.display='none';
  $('game').classList.add('on');
  $('lastSub').textContent = human==='w' ? 'waiting for your move' : 'thinking…';
  $('infoBadge').innerHTML=`<span class="pc">${human==='w'?'♔':'♚'}</span> you play <b>${human==='w'?'White':'Black'}</b>`;

  // paint each card with the colour that side actually plays
  const iAmWhite = human==='w';
  $('plyMine').classList.toggle('light', iAmWhite);
  $('plyMine').classList.toggle('dark', !iAmWhite);
  $('plyTheirs').classList.toggle('light', !iAmWhite);
  $('plyTheirs').classList.toggle('dark', iAmWhite);
  $('myKing').textContent    = iAmWhite ? '♔' : '♚';
  $('theirKing').textContent = iAmWhite ? '♚' : '♔';
  $('mySide').textContent    = iAmWhite ? 'White' : 'Black';
  $('theirSide').textContent = iAmWhite ? 'Black' : 'White';
  unlockSpeech(); keepAwake(true);
  render();
  if(human==='b') botTurn();
}

/* The stage shows ONE turn: white's move and black's reply to it.
   Whoever has not moved yet in the current turn shows an empty slot — filling it
   with a move from the previous turn makes it look like they already played. */
function renderStage(){
  const h=game.history({verbose:true});
  const num=Math.floor(h.length/2)+ (h.length%2 ? 1 : (h.length?0:1));

  // moves belonging to the turn on show: index of white's move for this pair
  const pairStart = h.length%2 ? h.length-1 : h.length-2;   // -2 when the pair is complete
  const white = pairStart>=0 ? h[pairStart] : null;
  const black = pairStart>=0 ? h[pairStart+1] : null;

  const mineMove   = human==='w' ? white : black;
  const theirsMove = human==='w' ? black : white;

  $('myMove').textContent   = mineMove   ? mineMove.san   : '—';
  $('lastMove').textContent = theirsMove ? theirsMove.san : '—';
  $('turnLab').textContent  = 'Move '+Math.max(1,Math.ceil((h.length||1)/2));
}

function play(m){
  if(busy||over) return;
  game.move(m); resetSel(); showMsg(''); $('mv').value='';
  $('lastSub').textContent='';
  if(game.game_over()){ over=true; render(); return; }
  render(); botTurn();
}
function botTurn(){
  busy=true; render();
  // keep the pause natural: thinking time absorbs the engine's own search time
  const want = 900 + Math.random()*1600;
  const t0 = Date.now();
  setTimeout(()=>{
    const m = pickBotMove();                 // may take a moment at high ELO
    const rest = Math.max(120, want-(Date.now()-t0));
    setTimeout(()=>{
      if(m){
        const r=game.move(m);
        const d=describe(r);
        $('lastSub').textContent=d;
        $('lastSub').classList.toggle('warn', d.includes('EN PASSANT'));
        const card=$('plyTheirs'); card.classList.remove('fresh'); void card.offsetWidth; card.classList.add('fresh');
        say(sanToSpeech(r.san) + (r.flags&&r.flags.includes('e') ? ', en passant' : ''));
      }
      busy=false;
      if(game.game_over()) over=true;
      render();
    }, rest);
  }, 30);
}

function describe(m){
  if(m.flags && m.flags.includes('e')){
    const ghost = m.to[0] + m.from[1];      // the captured pawn is NOT on the landing square
    return `pawn ${m.from} → ${m.to} · EN PASSANT · remove the pawn on ${ghost}`;
  }
  let s=`${PNAME[m.piece].toLowerCase()} ${m.from} → ${m.to}`;
  if(m.captured) s+=` · takes ${PNAME[m.captured].toLowerCase()}`;
  if(m.promotion) s+=` · promotes to ${PNAME[m.promotion].toLowerCase()}`;
  if(m.san.includes('#')) s+=' · mate';
  else if(m.san.includes('+')) s+=' · check';
  return s;
}

/* ============ 7. Render ============ */
function render(){
  const st=$('state'); st.className='state';
  if(game.game_over()){
    if(game.in_checkmate()){
      const win=game.turn()!==human;
      st.classList.add(win?'win':'mate');
      st.textContent=win?'CHECKMATE — YOU WIN':'CHECKMATE — YOU LOSE';
    } else if(game.in_stalemate()){ st.classList.add('draw'); st.textContent='STALEMATE — DRAW'; }
    else if(game.in_threefold_repetition()){ st.classList.add('draw'); st.textContent='DRAW — REPETITION'; }
    else if(game.insufficient_material()){ st.classList.add('draw'); st.textContent='DRAW — INSUFFICIENT MATERIAL'; }
    else { st.classList.add('draw'); st.textContent='DRAW — 50-MOVE RULE'; }
  } else if(game.in_check()){
    st.classList.add('check');
    st.textContent = game.turn()===human ? 'YOU ARE IN CHECK' : 'OPPONENT IN CHECK';
  } else st.textContent = busy ? 'Opponent thinking…' : 'Your turn';

  const h=game.history();
  let html='';
  for(let i=0;i<h.length;i+=2)
    html+=`<div class="row"><span class="n">${i/2+1}.</span><span>${h[i]||''}</span><span class="b">${h[i+1]||''}</span></div>`;
  $('hist').innerHTML = html || '<div class="empty">No moves yet</div>';
  const n=h.length;
  $('histCount').textContent = n===0 ? 'no moves' : (n===1 ? '1 move' : n+' moves');
  const hp=$('histPanel'); if(hp.classList.contains('on')) hp.scrollTop=hp.scrollHeight;
  if($('boardPanel').classList.contains('on')) renderBoard();

  renderStage();
  if($('lastMove').textContent==='—'){ $('lastSub').textContent=''; $('lastSub').classList.remove('warn'); }

  // light up the frame of whoever has to move
  const myTurn = !over && !busy && game.turn()===human;
  document.querySelector('.mine').classList.toggle('turn', myTurn);
  $('plyTheirs').classList.toggle('turn', !over && !myTurn);

  const mine = !over && !busy && game.turn()===human;
  $('mv').disabled=!mine; $('playBtn').disabled=!mine;
  renderKeys();
}
function renderBoard(){
  const b=game.board(), files=['a','b','c','d','e','f','g','h'], flip=human==='b';
  const idx=[...Array(8).keys()], rows=flip?[...idx].reverse():idx, cols=flip?[...idx].reverse():idx;
  const h=game.history({verbose:true}), lm=h.length?h[h.length-1]:null;
  let out='';
  for(const r of rows){
    const rank=8-r; out+=`<div class="coord">${rank}</div>`;
    for(const c of cols){
      const sq=b[r][c], nm=files[c]+rank, dark=(r+c)%2===1;
      const hl=lm&&(lm.from===nm||lm.to===nm)?' hl':'';
      out+=`<div class="sq ${dark?'d':'l'}${hl}">${sq?`<span class="${sq.color} pc-${sq.type}">${BOARD_GLYPH[sq.type]}</span>`:''}</div>`;
    }
  }
  out+='<div class="coord"></div>'+cols.map(c=>`<div class="coord">${files[c]}</div>`).join('');
  $('board').innerHTML=out;
}
function showMsg(t,err){ const m=$('msg'); m.textContent=t; m.classList.toggle('err',!!err); }


/* ============ 9. Speech output ============ */
const SAY_PIECE={K:'king',Q:'queen',R:'rook',B:'bishop',N:'knight'};
const SAY_NUM={'1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight'};
let ttsOn=false, ttsVoice=null, ttsReady=false;

function sanToSpeech(san){
  const t=san.replace(/[+#]/g,'');
  if(t==='O-O')   return 'castles king side';
  if(t==='O-O-O') return 'castles queen side';
  const m=t.match(/^([KQRBN])?([a-h]?[1-8]?)?(x)?([a-h][1-8])(?:=([QRBN]))?$/);
  if(!m) return san.split('').join(' ');
  const [,piece,disamb,cap,target,promo]=m;
  const sq=s=>s[0]+' '+SAY_NUM[s[1]];
  let out=[];
  if(piece) out.push(SAY_PIECE[piece]);
  if(disamb) out.push(piece ? 'from '+(disamb.length===2?sq(disamb):(SAY_NUM[disamb]||disamb))+',' : disamb);
  if(cap) out.push('takes');
  out.push(sq(target));
  if(promo) out.push(', promotes to '+SAY_PIECE[promo]);
  return out.join(' ');
}

function pickVoice(){
  const vs=speechSynthesis.getVoices();
  ttsVoice = vs.find(v=>/en[-_]GB/i.test(v.lang)&&!/google/i.test(v.name))
          || vs.find(v=>/^en/i.test(v.lang))
          || vs[0] || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}

/* iOS refuses to speak unless the first utterance follows a tap */
function unlockSpeech(){
  if(ttsReady || !('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(' ');
  u.volume=0; speechSynthesis.speak(u);
  ttsReady=true;
}

function say(text){
  if(!ttsOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(ttsVoice) u.voice=ttsVoice;
  u.lang=ttsVoice?ttsVoice.lang:'en-GB';
  u.rate=.92; u.pitch=1;
  const el=$('plyTheirs');
  if(el){ u.onstart=()=>el.classList.add('speaking'); u.onend=()=>el.classList.remove('speaking'); }
  speechSynthesis.speak(u);
}

/* keep the screen awake while a game is running, or iOS suspends the page */
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); }
    else if(!on && wakeLock){ wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && !over && game) keepAwake(true);
});

(function initTts(){
  try{ ttsOn = localStorage.getItem('chess-tts')==='1'; }catch(e){}
  const btn=$('ttsBtn'), theirs=$('plyTheirs');
  if(!btn || !theirs) return;
  if(!('speechSynthesis' in window)){ btn.style.display='none'; ttsOn=false; return; }
  btn.classList.toggle('active',ttsOn);
  btn.onclick=()=>{
    ttsOn=!ttsOn;
    btn.classList.toggle('active',ttsOn);
    try{ localStorage.setItem('chess-tts',ttsOn?'1':'0'); }catch(e){}
    if(ttsOn){ unlockSpeech(); say('audio on'); }
    else speechSynthesis.cancel();
  };
  theirs.onclick=()=>{
    const san=$('lastMove').textContent;
    if(san && san!=='—'){ unlockSpeech(); say(sanToSpeech(san)); }
  };
})();



/* ============ 11. Export the game ============ */
function gameTags(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const date=d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());
  let result='*';
  if(game.game_over()){
    if(game.in_checkmate()) result = game.turn()==='w' ? '0-1' : '1-0';
    else result='1/2-1/2';
  }
  return {date,result};
}
function buildPGN(){
  const {date,result}=gameTags();
  const me='You', bot='Engine '+level;
  const head=[
    '[Event "Casual game"]',
    '[Site "luca-chess-notation.netlify.app"]',
    '[Date "'+date+'"]',
    '[Round "-"]',
    '[White "'+(human==='w'?me:bot)+'"]',
    '[Black "'+(human==='b'?me:bot)+'"]',
    '[Result "'+result+'"]',
    '', ''                      // PGN requires a blank line between tags and moves
  ].join('\n');
  const h=game.history();
  let body='';
  for(let i=0;i<h.length;i+=2){
    body += (i/2+1)+'. '+h[i]+(h[i+1]?' '+h[i+1]:'')+' ';
    if((i/2+1)%8===0) body+='\n';
  }
  return head+body.trim()+' '+result+'\n';
}
function download(name,text,mime){
  const blob=new Blob([text],{type:mime+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
}

/* ============ 8. Events ============ */
$('startBtn').onclick=startGame;
$('pgnBtn').onclick=()=>{
  if(!game || !game.history().length){ showMsg('No moves to export yet.',true); return; }
  download('chess-'+stamp()+'.pgn', buildPGN(), 'application/x-chess-pgn');
};
$('undoBtn').onclick=()=>{
  if(busy) return;
  const h=game.history({verbose:true});
  if(!h.length) return;
  // step back to just before my own last move (drops the reply too)
  if(h[h.length-1].color!==human) game.undo();
  if(game.history().length && game.history({verbose:true}).slice(-1)[0].color===human) game.undo();
  over=false; resetSel(); showMsg('Move taken back.');
  $('lastSub').textContent='';
  render();
};
$('backBtn').onclick=()=>{ if(sel.to) sel.to=null; else sel.piece=null; renderKeys(); };
$('newBtn').onclick=()=>{ keepAwake(false); if('speechSynthesis' in window) speechSynthesis.cancel();
  $('game').classList.remove('on'); $('setup').style.display='flex'; };
function togglePanel(pid,bid,otherP,otherB){
  const on=$(pid).classList.toggle('on');
  $(bid).classList.toggle('active',on);
  if(on){ $(otherP).classList.remove('on'); $(otherB).classList.remove('active'); }
  render();
}
$('histBtn').onclick=()=>togglePanel('histPanel','histBtn','boardPanel','boardBtn');
$('boardBtn').onclick=()=>togglePanel('boardPanel','boardBtn','histPanel','histBtn');
$('kbBtn').onclick=()=>{
  const on=$('typed').classList.toggle('on');
  $('kbBtn').classList.toggle('active',on);
  $('keys').style.display = on ? 'none' : '';
  if(on) $('mv').focus();
};
$('playBtn').onclick=()=>{
  const r=resolveText($('mv').value.trim());
  if(!r){ showMsg('Not a legal move.',true); return; }
  if(r.ambiguous){ showMsg('Ambiguous — '+r.ambiguous.map(m=>m.san).join(' / '),true); return; }
  play(r);
};
$('mv').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('playBtn').click(); }});
$('mv').addEventListener('input',()=>showMsg(''));
</script>
